<style>
/* Layout: sticky brand bar + tabs; quote editor is a two-column workbench (form left, live A4 letterhead preview right), stacking on phones. */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --sunk:#EEF1F6; --ink:#18213A; --muted:#5D677A; --line:#DCE1EA;
  --brand:#14305F; --on-brand:#FFFFFF; --brand-ink:#14305F; --mag:#841564; --mag-soft:#F6E8F1; --orange:#E5782A;
  --ok:#1D7A4C; --ok-soft:#E3F3EA; --warn:#A35A00; --warn-soft:#FBEFD9; --bad:#B42318; --bad-soft:#FCE8E6; --info:#2357A6; --info-soft:#E4ECFA;
  --f-display:'Montserrat','Segoe UI',Arial,sans-serif; --f-body:'Source Sans 3','Segoe UI',system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1422; --surface:#161E31; --sunk:#111829; --ink:#E7EBF3; --muted:#9AA4B8; --line:#28324B;
  --brand:#3A62AE; --on-brand:#FFFFFF; --brand-ink:#B9CCF0; --mag:#E388C0; --mag-soft:#33203A; --orange:#F09A58;
  --ok:#5BC48A; --ok-soft:#173326; --warn:#E9A94B; --warn-soft:#3A2B13; --bad:#FF8A7D; --bad-soft:#3D1D1B; --info:#8DB2F2; --info-soft:#1B2A47;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1422; --surface:#161E31; --sunk:#111829; --ink:#E7EBF3; --muted:#9AA4B8; --line:#28324B;
  --brand:#3A62AE; --on-brand:#FFFFFF; --brand-ink:#B9CCF0; --mag:#E388C0; --mag-soft:#33203A; --orange:#F09A58;
  --ok:#5BC48A; --ok-soft:#173326; --warn:#E9A94B; --warn-soft:#3A2B13; --bad:#FF8A7D; --bad-soft:#3D1D1B; --info:#8DB2F2; --info-soft:#1B2A47;
  color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:34px;height:auto;display:block}
.brand b{font:700 18px/1 var(--f-display);color:var(--brand-ink);letter-spacing:-.2px}.brand b span{color:var(--mag)}
.brand small{display:block;font:600 10px/1.2 var(--f-display);letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);margin-top:3px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;flex:1 1 auto;min-width:0;scrollbar-width:none}
nav.tabs button{font:600 14px var(--f-body);color:var(--muted);background:none;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{color:var(--ink);background:var(--sunk)}
nav.tabs button[aria-current="page"]{color:var(--brand-ink);background:var(--mag-soft);box-shadow:inset 0 -2px 0 var(--mag)}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.who img{width:26px;height:26px;border-radius:50%}
.mode{font:600 11px var(--f-body);padding:3px 8px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.mode.shared{color:var(--ok);background:var(--ok-soft);border-color:transparent}.mode.local{color:var(--warn);background:var(--warn-soft);border-color:transparent}
main{padding-block:20px 60px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:22px;font-weight:700;color:var(--brand-ink)}h2{font-size:15px;font-weight:600}h3{font-size:13px;font-weight:600}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head .actions{display:flex;gap:8px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel>h2{margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.grid .span2{grid-column:span 2}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:14.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--brand) 55%,transparent);outline-offset:0;border-color:var(--brand)}
input[readonly]{background:var(--sunk);color:var(--muted)}
.btn{font:600 14px var(--f-body);display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}.btn.pri:hover{filter:brightness(1.12)}
.btn.mag{background:var(--mag);border-color:var(--mag);color:#fff}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--mag);outline-offset:2px}
.x{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:4px 6px;border-radius:6px}.x:hover{color:var(--bad);background:var(--bad-soft)}
.muted{color:var(--muted)}.small{font-size:12.5px}.num{font-variant-numeric:tabular-nums}.r{text-align:right}.c{text-align:center}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.6px;color:var(--muted);text-align:left;padding:9px 10px;background:var(--sunk);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--sunk) 60%,transparent)}
td input,td select{padding:5px 7px;font-size:14px}
.chip{display:inline-block;font:600 12px var(--f-body);padding:2px 9px;border-radius:99px;white-space:nowrap}
.st-Draft{background:var(--sunk);color:var(--muted)}.st-Sent{background:var(--info-soft);color:var(--info)}.st-Won{background:var(--ok-soft);color:var(--ok)}.st-Lost{background:var(--bad-soft);color:var(--bad)}.st-Revised{background:var(--sunk);color:var(--muted);text-decoration:line-through}
.flag{font-size:12px;font-weight:600}.flag.warn{color:var(--warn)}.flag.bad{color:var(--bad)}.flag.ok{color:var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi span{font-size:12.5px;font-weight:600;color:var(--muted)}
.kpi b{display:block;font:700 24px/1.2 var(--f-display);color:var(--brand-ink);margin-top:4px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-size:12.5px}
.cols2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:15px;margin-bottom:6px}
.empty .btn{margin-top:12px}
/* editor */
.editor{display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,500px);gap:20px;align-items:start}
.preview{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 90px)}
.preview .bar{display:flex;gap:8px;flex-wrap:wrap}
.pages{overflow:auto;display:flex;flex-direction:column;gap:12px;padding:12px;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);min-height:200px}
.pages canvas{width:100%;height:auto;display:block;background:#fff;box-shadow:0 1px 3px rgba(10,20,40,.18),0 6px 20px rgba(10,20,40,.08);border-radius:2px}
.items td{vertical-align:top}
.items .desc{min-width:190px}.items select{min-width:76px}.items td,.items th{padding:7px 6px}.items .desc input+input{margin-top:5px;font-size:13px;color:var(--muted)}
.items .thumb{width:44px;height:44px;object-fit:contain;border:1px solid var(--line);border-radius:6px;background:#fff;display:block}
.items .ph{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:1px dashed var(--line);border-radius:6px;color:var(--muted);font-size:11px;cursor:pointer;text-align:center;line-height:1.1}
.items .ph:hover{border-color:var(--brand);color:var(--brand-ink)}
.picker{position:relative}
.picker ul{position:absolute;z-index:8;left:0;right:0;top:calc(100% + 3px);margin:0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(10,20,40,.18);max-height:300px;overflow:auto}
.picker li{padding:7px 9px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.picker li:hover,.picker li.on{background:var(--sunk)}
.picker li b{font-weight:600}.picker li span{white-space:nowrap}
.totals{margin-left:auto;width:min(100%,340px);display:flex;flex-direction:column;gap:6px;font-variant-numeric:tabular-nums}
.totals>div{display:flex;justify-content:space-between;align-items:center;gap:8px}
.totals .grand{font:700 20px var(--f-display);color:var(--brand-ink);border-top:2px solid var(--brand-ink);padding-top:8px;margin-top:4px}
.internal{background:repeating-linear-gradient(135deg,var(--surface) 0 10px,var(--sunk) 10px 20px);border-style:dashed}
.internal .row{display:flex;gap:22px;flex-wrap:wrap;align-items:baseline}
.internal .row b{font:700 18px var(--f-display);font-variant-numeric:tabular-nums}
.banner{padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:14px}
.banner.warn{background:var(--warn-soft);color:var(--warn)}.banner.info{background:var(--info-soft);color:var(--info)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--muted);padding:6px 10px;font:600 13px var(--f-body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
.toolbar>label{flex:1 1 200px}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:6px;border-bottom:1px solid var(--line)}
.bars .m{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.bars .pair{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.bars i{display:block;width:40%;max-width:18px;border-radius:3px 3px 0 0;min-height:1px}
.bars i.q{background:color-mix(in srgb,var(--brand-ink) 35%,transparent)}.bars i.w{background:var(--mag)}
.bars-x{display:flex;gap:10px}.bars-x span{flex:1;text-align:center;font-size:12px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-bottom:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.list{display:flex;flex-direction:column}
.list .li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.list .li:last-child{border-bottom:0}
.list .li button{font:inherit;background:none;border:0;padding:0;color:var(--brand-ink);font-weight:600;cursor:pointer;text-align:left}
.modal{position:fixed;inset:0;z-index:50;background:rgba(8,14,28,.5);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(40px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;width:min(100%,560px);display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad);color:#fff}
.imgprev{max-height:70px;max-width:160px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:4px}
.st-Unpaid{background:var(--warn-soft);color:var(--warn)}.st-Paid{background:var(--ok-soft);color:var(--ok)}.st-Cancelled{background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.chips{display:flex;flex-wrap:wrap;gap:6px}.uchip{display:inline-flex;align-items:center;gap:2px;padding:3px 4px 3px 10px;border:1px solid var(--line);border-radius:99px;font-size:13.5px;background:var(--sunk)}.uchip .x{font-size:16px;padding:0 5px}
.linkbtn{background:none;border:0;padding:0;color:var(--brand-ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:underline}
.fx{font-size:12px;color:var(--muted);font-weight:400}
@media (max-width:1100px){.editor{grid-template-columns:minmax(0,1fr)}.preview{position:static;max-height:none}.cols2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.top .wrap{gap:8px}.who .nm{display:none}.panel{padding:14px}h1{font-size:19px}.grid{grid-template-columns:1fr 1fr}.grid .span2{grid-column:1/-1}input,select,textarea{font-size:16px}}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function dbErr(e){

  if(['revoked','not_granted','capability_disabled','capability_removed','unavailable'].includes(e.code))toast('Lost the connection to the shared data. Reload the page to reconnect.','bad');
  else if(e.code=='quota_exceeded')toast('The shared database is full. Delete old quotes or photos to make room.','bad');
  else toast('Data error: '+(e.message||e.code),'bad');
}
async function safe(fn,okMsg){
  try{await fn();if(okMsg)toast(okMsg)}catch(e){
    if(e&&e.code=='permission-denied'){toast('Your account is not allowed to make this change. Ask an admin.','bad');return}
    if(e&&e.code=='invalid_argument'&&MODE=='shared'){CAN_WRITE=false;renderWho();toast('You have view-only access, so changes cannot be saved.','bad');render()}

}

  const y=new Date().getFullYear(),key=({invoice:'i',ci:'c'}[kind]||'q')+y;
  let n;

    const ref=DB.collection('counters').doc(key);
    n=await DB.runTransaction(async tx=>{const s=await tx.get(ref);let v=(s.exists&&+s.data().seq)||1;while(numberUsed(kind,y,v))v++;tx.set(ref,{seq:v+1});return v});
  }else{

  }

}

function lineAmt(l,d=2){return rd((+l.qty||0)*(+l.price||0)*(1-(+l.disc||0)/100),d)}
function calc(q){
  const d=decOf(q);let sub=0,cost=0;for(const l of q.lines){sub+=lineAmt(l,d);cost+=(+l.qty||0)*(+l.cost||0)}
  sub=rd(sub,d);const disc=rd(q.discType=='amt'?Math.min(sub,+q.disc||0):sub*(+q.disc||0)/100,d),net=rd(sub-disc,d),vat=isCom(q)?0:rd(net*(+q.vat||0)/100,d),total=rd(net+vat+(isCom(q)?(+q.freight||0)+(+q.insurance||0):0),d);
  return {sub,disc,net,vat,total,cost:rd(cost,d),margin:rd(net-cost,d),pct:net?(net-cost)/net*100:0};
}
const validUntil=q=>addDays(q.date,q.validDays);

function flags(q){
  const t=today(),f=[];
  if(isInv(q)){
    if(q.status=='Unpaid'){const dd=dueDate(q);if(dd<t)f.push(['bad','Overdue since '+fmtDate(dd)]);else if(dd<=addDays(t,3))f.push(['warn','Due '+fmtDate(dd)])}
    return f;
  }
  if(['Draft','Sent'].includes(q.status)){
    const vu=validUntil(q);if(vu<t)f.push(['bad','Expired '+fmtDate(vu)]);else if(vu<=addDays(t,3))f.push(['warn','Expires '+fmtDate(vu)]);
    if(q.status=='Sent'&&q.followUp&&q.followUp<=t)f.push(['warn','Follow up due']);
  }
  return f;
}

async function setStatus(id,v){

    return modal(`<h2>Why was ${esc(qNo(q))} lost?</h2><label class="f">Reason<select name="reason">${['Price too high','Lead time','Bought elsewhere','Project cancelled','No response','Other'].map(r=>`<option>${r}</option>`).join('')}</select></label><label class="f">Notes (optional)<input name="note"></label>`,{okLabel:'Mark as lost',onOk:async fd=>{q.lostReason=fd.reason+(fd.note?': '+fd.note:'');await applyStatus(q,'Lost')}}).querySelector('[data-close]').addEventListener('click',()=>render());
  }
  await applyStatus(q,v);
}
async function applyStatus(q,v){
  const inv=isInv(q);let moved=false;
  await safe(async()=>{
    const moves=[],should=inv?(!!q.deductStock&&v!='Cancelled'):v=='Won';
    if(should&&!q.stockApplied){q.lines.forEach(l=>l.pid&&moves.push([l.pid,-(+l.qty||0)]));q.stockApplied=true;if(!inv)q.wonAt=today()}
    if(!should&&q.stockApplied){q.lines.forEach(l=>l.pid&&moves.push([l.pid,+(+l.qty||0)]));q.stockApplied=false;if(!inv)q.wonAt=''}
    for(const[pid,d]of moves){const p=state.products[pid];if(p){await store.put('products',pid,Object.assign(clean(p),{stock:Math.max(0,(+p.stock||0)+d)}));moved=true}}
    if(inv)q.paidAt=v=='Paid'?(q.paidAt||today()):'';
    q.status=v;stamp(q,'Status set to '+v);await store.put('quotes',q.id,q);
  },v=='Won'?'Marked as won. Stock updated.':v=='Paid'?'Marked as paid.':v=='Cancelled'?'Invoice cancelled.'+(q.deductStock?' Its items are back in stock.':''):'Status updated.');
}

async function saveQuote(){
  if(!CAN_WRITE){toast('You have view-only access, so this quote cannot be saved.','bad');return false}
  const err=validate();if(err){toast(err,'bad');return false}
  let ok=false;
  await safe(async()=>{
    if(!Q.no){const ser=seriesOf(Q),n=await nextNumber(ser);Q.year=n.year;Q.seq=n.seq;Q.no=`${ser=='ci'?(SET().ciPrefix||'CI'):ser=='invoice'?(SET().invPrefix||'INV'):(SET().prefix||'CCQ')}-${n.year}-${String(n.seq).padStart(4,'0')}`;Q.createdAt=new Date().toISOString();Q.createdBy=ME||''}
    // remember the customer
    const nm=Q.cust.name.trim();let cu=Object.values(state.customers).find(c=>c.name.toLowerCase()==nm.toLowerCase());
    if(!cu){cu={id:'c'+uid(),name:nm,addr:Q.cust.addr,trn:Q.cust.trn,attn:Q.cust.attn,phone:Q.cust.phone,email:Q.cust.email,createdAt:today()};await store.put('customers',cu.id,cu)}
    else{const upd=Object.assign(clean(cu),...['addr','trn','attn','phone','email'].filter(k=>Q.cust[k]&&!cu[k]).map(k=>({[k]:Q.cust[k]})));if(JSON.stringify(upd)!==JSON.stringify(cu))await store.put('customers',cu.id,upd)}
    Q.cust.id=cu.id;
    const prev=state.quotes[Q.id];
    if(prev&&prev.stockApplied){ // keep stock in step with edits to a won quote
      const diff={};prev.lines.forEach(l=>l.pid&&(diff[l.pid]=(diff[l.pid]||0)+(+l.qty||0)));Q.lines.forEach(l=>l.pid&&(diff[l.pid]=(diff[l.pid]||0)-(+l.qty||0)));
      for(const pid in diff){const p=state.products[pid];if(p&&diff[pid])await store.put('products',pid,Object.assign(clean(p),{stock:Math.max(0,(+p.stock||0)+diff[pid])}))}
    }
    if(!prev&&isInv(Q)&&Q.deductStock&&Q.status!='Cancelled'&&!Q.stockApplied){ // an invoice not made from a won quote takes its items out of stock
      for(const l of Q.lines){const p=l.pid&&state.products[l.pid];if(p)await store.put('products',p.id,Object.assign(clean(p),{stock:Math.max(0,(+p.stock||0)-(+l.qty||0))}))}

    if(Q.staffId)lsSet('cc-staff',Q.staffId);

  if(ok){toast('Saved as '+qNo(Q));render()}
  return ok;
}

      Object.assign(p,{code,hs:(fd.hs||'').trim(),origin:(fd.origin||'').trim(),desc:fd.desc.trim(),details:fd.details.trim(),cat:fd.cat.trim(),uom,sup:fd.sup.trim(),price:numv(fd.price),cost:numv(fd.cost),stock:numv(fd.stock),min:numv(fd.min)});
      const file=m.querySelector('#pPhoto').files[0];

async function importProducts(file){
  const rows=parseCSV(await readText(file));if(rows.length<2){toast('That file has no product rows.','bad');return}
  const hd=rows[0].map(h=>h.toLowerCase().trim()),ix=keys=>hd.findIndex(h=>keys.some(k=>h.includes(k)));
  const codeIx=(()=>{let i=hd.findIndex(h=>['code','item code','product code','sku','item no'].includes(h));if(i<0)i=hd.findIndex(h=>h.includes('code')&&!h.includes('hs'));return i})();
  const c={code:codeIx,hs:hd.findIndex(h=>h.includes('hs')),org:ix(['origin']),desc:ix(['desc','name']),det:ix(['detail','spec']),cat:ix(['cat']),uom:ix(['unit','uom']),stock:ix(['stock','qty','quantity']),min:ix(['min']),price:ix(['price','selling','rate']),cost:ix(['cost','purchase']),sup:ix(['supplier','vendor'])};
  if(c.code<0||c.desc<0){toast('The file needs at least a Code and a Description column.','bad');return}
  const byCode={};Object.values(state.products).forEach(p=>byCode[p.code.toLowerCase()]=p);
  const items=rows.slice(1).filter(r=>r[c.code]&&r[c.code].trim()).map(r=>{const g=k=>c[k]>=0?String(r[c[k]]||'').trim():'';const ex=byCode[g('code').toLowerCase()];
    return Object.assign(ex?clean(ex):{id:'p'+uid(),imgId:''},{code:g('code'),desc:g('desc')||(ex&&ex.desc)||'',details:c.det>=0?g('det'):(ex&&ex.details)||'',cat:c.cat>=0?g('cat'):(ex&&ex.cat)||'',uom:g('uom')||(ex&&ex.uom)||'Nos',stock:c.stock>=0?numv(g('stock')):(ex?ex.stock:0),min:c.min>=0?numv(g('min')):(ex?ex.min:0),price:c.price>=0?numv(g('price')):(ex?ex.price:0),cost:c.cost>=0?numv(g('cost')):(ex?ex.cost:0),sup:c.sup>=0?g('sup'):(ex&&ex.sup)||'',hs:c.hs>=0?g('hs'):(ex&&ex.hs)||'',origin:c.org>=0?g('org'):(ex&&ex.origin)||''})});
  const upd=items.filter(i=>byCode[i.code.toLowerCase()]).length;
  confirmBox('Import '+items.length+' products?',(items.length-upd)+' new, '+upd+' updated by matching code. Nothing is deleted.','Import',async()=>{
    let n=0;await safe(async()=>{for(const p of items){await store.put('products',p.id,p);n++}});toast(n+' products imported.');
  },false);
}

  {okLabel:'Save',onOk:async fd=>{Object.assign(p,{name:fd.name.trim(),title:fd.title.trim(),phone:fd.phone.trim(),email:fd.email.trim()});await safe(()=>store.put('staff',p.id,p),'Saved.')}});
}
async function backup(){
  const s=SET(),imgIds=new Set([s.stampImg,s.signImg,...Object.values(state.products).map(p=>p.imgId),...Object.values(state.quotes).flatMap(q=>q.lines.map(l=>l.imgId))].filter(Boolean));
  const images={};for(const id of imgIds){const d=await loadImg(id);if(d)images[id]=d}
  const data={app:'citycube-quote-desk',version:1,exportedAt:new Date().toISOString(),settings:state.settings,products:state.products,customers:state.customers,quotes:state.quotes,staff:state.staff,images};
  saveFile('citycube-quote-desk-backup-'+today()+'.json',new Blob([JSON.stringify(data)],{type:'application/json'}));
}
async function restore(file){
  let d;try{d=JSON.parse(await readText(file))}catch(e){toast('That file is not a Quote Desk backup.','bad');return}
  if(!d||d.app!=='citycube-quote-desk'){toast('That file is not a Quote Desk backup.','bad');return}
  const n=k=>Object.keys(d[k]||{}).length;
  confirmBox('Restore this backup?',`It adds or replaces ${n('quotes')} quotes, ${n('products')} products, ${n('customers')} customers and ${n('staff')} staff by their ID. Records that are not in the backup are kept.`,'Restore',async()=>{
    await safe(async()=>{for(const col of ['images','settings','staff','customers','products','quotes'])for(const[id,o]of Object.entries(d[col]||{}))await store.put(col,id,o)},'Backup restored.');
  });
}

/* ---------- events ---------- */
function startNew(kind){const go2=()=>newQuote(null,kind);if(DIRTY&&VIEW=='quote')confirmBox('Discard unsaved changes?','The current document has changes that are not saved.','Discard',go2);else go2()}
const ACT={
  go:t=>go(t.dataset.v), newq:()=>startNew('quote'), newinv:()=>startNew('invoice'),
  mkinv:t=>{if(DIRTY&&Q&&Q.id!=t.dataset.id)confirmBox('Discard unsaved changes?','The document you were editing has changes that are not saved.','Discard',()=>{DIRTY=false;makeInvoice(t.dataset.id)});else makeInvoice(t.dataset.id)},
  istatus:t=>{ui.iStatus=t.dataset.v;render()},
  example:()=>exampleQuote(), saveq:()=>saveQuote(), pdf:()=>downloadPdf(), revise:()=>revise(),

  dupq:t=>duplicate(t.dataset.id),

  qstatus:t=>{ui.qStatus=t.dataset.v;render()}, exportq:()=>{const rows=[['Number','Revision','Document','Date','Valid until','Customer','Customer TRN','Subject','Reference','Prepared by','Status','Currency','Rate to AED','Subtotal','Discount','VAT','Total','Total AED','Cost','Margin','Margin %','Lost reason']];Object.values(state.quotes).filter(q=>!isInv(q)).sort((a,b)=>(a.no||'').localeCompare(b.no||'')).forEach(q=>{const c=calc(q);rows.push([q.no,q.rev,q.docType,q.date,validUntil(q),q.cust.name,q.cust.trn,q.subject,q.ref,(state.staff[q.staffId]||{}).name||'',q.status,curOf(q).code,rateOf(q),c.sub,c.disc,c.vat,c.total,rd(toAED(q,c.total)),c.cost,c.margin,c.pct.toFixed(1),q.lostReason||''])});saveFile('citycube-quotes-'+today()+'.csv',toCSV(rows))},
  exporti:()=>{const rows=[['Invoice number','Document','Invoice date','Date of supply','Due date','Customer','Customer TRN','LPO / PO no.','Delivery note','Quotation','Status','Paid on','Currency','Rate to AED','Taxable amount','VAT %','VAT','Total','Taxable amount AED','VAT AED','Total AED']];Object.values(state.quotes).filter(isInv).sort((a,b)=>(a.no||'').localeCompare(b.no||'')).forEach(q=>{const c=calc(q);rows.push([q.no,q.docType,q.date,q.supplyDate||q.date,dueDate(q),q.cust.name,q.cust.trn,q.ref,q.dn||'',q.quoteNo||'',q.status,q.paidAt||'',curOf(q).code,rateOf(q),c.net,q.vat,c.vat,c.total,rd(toAED(q,c.net)),rd(toAED(q,c.vat)),rd(toAED(q,c.total))])});saveFile('citycube-invoices-'+today()+'.csv',toCSV(rows))},
  addline:t=>{Q.lines.push({lid:uid(),pid:'',code:'',desc:t.dataset.desc||'',details:'',uom:'Nos',qty:1,price:0,disc:0,cost:0,sup:'',imgId:''});const pk=$('#pick');if(pk){pk.value='';$('#pickList').hidden=true}markDirty();renderItems();schedulePreview();const ins=$$('[data-l$=".desc"]');ins.length&&ins.at(-1).focus()},
  rmline:t=>{Q.lines.splice(+t.dataset.i,1);markDirty();renderItems();schedulePreview()},
  mvline:t=>{const i=+t.dataset.i,j=i+(+t.dataset.d);if(j<0||j>=Q.lines.length)return;[Q.lines[i],Q.lines[j]]=[Q.lines[j],Q.lines[i]];markDirty();renderItems();schedulePreview()},
  rmimg:t=>{Q.lines[+t.dataset.i].imgId='';markDirty();renderItems();schedulePreview()},
  pickp:t=>{const p=state.products[t.dataset.id];p&&addProductLine(p)},
  disctype:t=>{Q.discType=t.dataset.v;markDirty();renderTotals();schedulePreview()},
  togglecost:()=>{SHOW_COST=!SHOW_COST;lsSet('cc-showcost',SHOW_COST);if(VIEW=='quote'){const mb=$('#marginBox');if(mb)mb.hidden=!SHOW_COST;$$('[data-act="togglecost"]').forEach(b=>b.textContent=(SHOW_COST?'Hide':'Show')+' costs');renderItems()}else render()},
  copymsg:async()=>{const txt=waText();try{await navigator.clipboard.writeText(txt);toast('Message copied. Paste it into your email or WhatsApp.')}catch(e){modal(`<h2>Copy this message</h2><textarea rows="10" readonly id="cpy">${esc(txt)}</textarea>`,{okLabel:'Done'});setTimeout(()=>{const a=$('#cpy');a&&a.select()},30)}},
  editp:t=>editProduct(t.dataset.id), delp:t=>{const p=state.products[t.dataset.id];confirmBox('Delete '+p.code+'?','Saved quotes keep their copy of this item.','Delete product',()=>safe(()=>store.del('products',p.id),'Product deleted.'))},
  tplcsv:()=>saveFile('citycube-products-template.csv',toCSV([['Code','Description','Details','Category','Unit','Stock','Min stock','Price','Cost','Supplier','HS code','Origin'],['EXAMPLE-001','Example item - replace me','Size, model or spec','Power tools','Nos',10,2,100,75,'Supplier name','8467.21','China']])),
  expp:()=>saveFile('citycube-products-'+today()+'.csv',toCSV([['Code','Description','Details','Category','Unit','Stock','Min stock','Price','Cost','Supplier','HS code','Origin'],...Object.values(state.products).map(p=>[p.code,p.desc,p.details,p.cat,p.uom,p.stock,p.min,p.price,p.cost,p.sup,p.hs||'',p.origin||''])])),
  editc:t=>editCustomer(t.dataset.id), delc:t=>{const c=state.customers[t.dataset.id];confirmBox('Delete '+c.name+'?','Saved quotes keep the customer details printed on them.','Delete customer',()=>safe(()=>store.del('customers',c.id),'Customer deleted.'))},
  quotefor:t=>{const c=state.customers[t.dataset.id];newQuote({cust:{id:c.id,name:c.name,addr:c.addr||'',trn:c.trn||'',attn:c.attn||'',phone:c.phone||'',email:c.email||''}})},
  expc:()=>saveFile('citycube-customers-'+today()+'.csv',toCSV([['Name','Contact','TRN','Address','Phone','Email'],...Object.values(state.customers).map(c=>[c.name,c.attn,c.trn,c.addr,c.phone,c.email])])),
  editst:t=>editStaff(t.dataset.id), delst:t=>{const p=state.staff[t.dataset.id];confirmBox('Remove '+p.name+'?','Quotes already saved keep their sign-off until they are edited.','Remove',()=>safe(()=>store.del('staff',p.id),'Removed.'))},
  rmsimg:t=>safe(()=>saveSettings({[t.dataset.k]:''}),'Removed.'), backup:()=>backup(),
  rmunit:t=>{const u=t.dataset.u;if(units().length<=1){toast('Keep at least one unit.','bad');return}safe(()=>saveSettings({units:units().filter(x=>x!==u)}),u+' removed.')},
  addunit2:()=>{const e=$('#newUnit'),u=e.value.trim();if(!u){e.focus();return}if(units().some(x=>x.toLowerCase()==u.toLowerCase())){toast(u+' is already in the list.','bad');return}safe(()=>saveSettings({units:[...units(),u]}),u+' added.')},
  resetunits:()=>confirmBox('Restore the standard unit list?','Units you added yourself are removed from the list. Saved quotes keep the units printed on them.','Restore',()=>safe(()=>saveSettings({units:DEFAULT_UNITS.slice()}),'Standard units restored.'),false),
  addcur:()=>modal(`<h2>Add a currency</h2><div class="grid"><label class="f">Code<input name="code" required maxlength="3" placeholder="EUR" style="text-transform:uppercase"></label><label class="f">1 unit = AED<input name="rate" type="number" step="any" min="0" required placeholder="e.g. 4.25"></label><label class="f">Name in words<input name="name" required placeholder="Euros"></label><label class="f">Small unit<input name="minor" placeholder="Cents"></label><label class="f">Decimals<select name="dec"><option>2</option><option>3</option><option>0</option></select></label></div>`,{okLabel:'Add currency',onOk:async fd=>{const code=fd.code.trim().toUpperCase();if(!/^[A-Z]{3}$/.test(code)){toast('Use the 3-letter currency code, for example EUR.','bad');return false}if(currencies().some(c=>c.code==code)){toast(code+' is already in the list.','bad');return false}if(!(+fd.rate>0)){toast('Enter how many AED one '+code+' is worth.','bad');return false}await safe(()=>saveSettings({currencies:[...currencies(),{code,name:fd.name.trim()||code,minor:fd.minor.trim(),dec:+fd.dec,rate:+fd.rate}]}),code+' added.')}}),
  rmcur:t=>{const c=t.dataset.c;confirmBox('Remove '+c+'?','Saved quotes and invoices in '+c+' keep their currency and rate.','Remove',()=>safe(()=>saveSettings({currencies:currencies().filter(x=>x.code!==c)}),c+' removed.'))},
  signout:()=>{const out=()=>{Q=null;DIRTY=false;AUTH.signOut()};if(DIRTY)confirmBox('Sign out with unsaved changes?','The quote you are editing has changes that are not saved.','Sign out',out);else out()},
  addacc:()=>modal(`<h2>Give someone access</h2><p class="small muted" style="margin:0">Create their login in Firebase first (Authentication &rsaquo; Users &rsaquo; Add user), then add the same email here.</p><label class="f">Email<input name="email" type="email" required autocomplete="off"></label><label class="f">Access<select name="role"><option value="sales">Sales</option><option value="admin">Admin</option></select></label>`,{okLabel:'Give access',onOk:async fd=>{const e=fd.email.trim().toLowerCase();if(!e)return false;await safe(()=>store.put('allowed',e,{email:e,role:fd.role,addedBy:ME,addedAt:today()}),e+' can now sign in.')}}),
  delacc:t=>confirmBox('Remove '+t.dataset.id+'?','They will no longer be able to open Quote Desk. Delete their login in Firebase too if they have left.','Remove access',()=>safe(()=>store.del('allowed',t.dataset.id),'Access removed.'))
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(t&&!t.disabled&&ACT[t.dataset.act]){if(t.tagName=='A')return;e.preventDefault();ACT[t.dataset.act](t,e);return}
  if(!e.target.closest('.picker')){const ul=$('#pickList');if(ul)ul.hidden=true}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.q&&Q){let v=t.type=='checkbox'?t.checked:t.value;if(['validDays','disc','vat','rate','dueDays','freight','insurance'].includes(t.dataset.q))v=+v||0;setP(Q,t.dataset.q,v);markDirty();
    if(t.dataset.q=='cust.name')pickCustomer(v);if(['disc','vat','rate','freight','insurance'].includes(t.dataset.q))renderTotals();
    schedulePreview();return}
  if(t.dataset.l&&Q&&t.dataset.l.endsWith('.uom')&&t.value=='__add'){const i=+t.dataset.l.split('.')[0];t.value=Q.lines[i].uom||units()[0];addUnit(i);return}
  if(t.dataset.l&&Q){const[i,k]=t.dataset.l.split('.');Q.lines[+i][k]=['qty','price','disc','cost'].includes(k)?Math.max(0,+t.value||0):t.value;markDirty();if(['qty','price','disc','cost'].includes(k))updateLineAmounts();schedulePreview();return}
  if(t.dataset.ui){ui[t.dataset.ui]=t.value;const id=t.id,pos=t.selectionStart;render();const n=id&&document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}return}
  if(t.id=='pick'){pickIdx=0;showPick()}
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.q=='docType'&&Q){const s=SET(),toInv=['Tax Invoice','Commercial Invoice'].includes(Q.docType);
    if(toInv&&!isInv(Q)){Q.kind='invoice';Q.status='Unpaid';Q.deductStock=true;if(Q.terms.payment==s.payment)Q.terms.payment=s.invPayment;if(Q.terms.delivery==s.delivery)Q.terms.delivery='';if(!Q.dueDays)Q.dueDays=+s.dueDays||0}
    else if(!toInv&&isInv(Q)&&!Q.no){Q.kind='quote';Q.status='Draft';Q.deductStock=false;if(Q.terms.payment==s.invPayment)Q.terms.payment=s.payment;if(!Q.terms.delivery)Q.terms.delivery=s.delivery}
    if(Q.docType=='Commercial Invoice'){if(Q.vatBefore==null)Q.vatBefore=+Q.vat||+s.vat;Q.vat=0;Q.ship=Q.ship||{}}else if(Q.vatBefore!=null){Q.vat=Q.vatBefore;delete Q.vatBefore}
    render();return}
  if(t.matches('[data-cur-select]')&&Q){changeCurrency(t.value);return}
  if(t.dataset.cur){QUIET=Date.now()+1500;const code=t.dataset.cur,v=+t.value||0;safe(()=>saveSettings({currencies:currencies().map(c=>c.code==code?Object.assign({},c,{rate:v}):c)}),'Rate saved.');return}
  if(t.dataset.actChange=='setstatus'){setStatus(t.dataset.id,t.value);return}
  if(t.dataset.p){QUIET=Date.now()+1500;const[id,k]=t.dataset.p.split('.');const p=state.products[id];if(p)safe(()=>store.put('products',id,Object.assign(clean(p),{[k]:+t.value||0})));return}
  if(t.dataset.s){QUIET=Date.now()+1500;const num=['vat','validDays','marginFloor','dueDays'].includes(t.dataset.s);safe(()=>saveSettings({[t.dataset.s]:num?(+t.value||0):t.value.trim()}),'Saved.');return}
  if(t.dataset.img!=null&&t.files[0]&&Q){const i=+t.dataset.img,line=Q.lines[i];await safe(async()=>{line.imgId=await uploadImage(t.files[0]);const p=line.pid&&state.products[line.pid];if(IS_ADMIN&&p&&!p.imgId)await store.put('products',p.id,Object.assign(clean(p),{imgId:line.imgId}))});markDirty();renderItems();schedulePreview();return}
  if(t.dataset.simg&&t.files[0]){const k=t.dataset.simg;await safe(async()=>{const id=await uploadImage(t.files[0],600,'image/png');await saveSettings({[k]:id})},'Uploaded.');return}
  if(t.dataset.ui=='pCat'){ui.pCat=t.value;render();return}
  if(t.dataset.role){const e=t.dataset.role,x=state.allowed[e];if(x)safe(()=>store.put('allowed',e,Object.assign(clean(x),{role:t.value})),'Access updated.');return}
  if(t.id=='impP'&&t.files[0])importProducts(t.files[0]);
  if(t.id=='impC'&&t.files[0])importCustomers(t.files[0]);
  if(t.id=='restoreF'&&t.files[0])restore(t.files[0]);
});
document.addEventListener('keydown',e=>{
  if(e.target.id=='pick'){const r=pickResults(e.target.value);
    if(e.key=='ArrowDown'){pickIdx=Math.min(r.length-1,pickIdx+1);showPick();e.preventDefault()}
    else if(e.key=='ArrowUp'){pickIdx=Math.max(0,pickIdx-1);showPick();e.preventDefault()}
    else if(e.key=='Enter'){e.preventDefault();if(r[pickIdx])addProductLine(r[pickIdx]);else if(e.target.value.trim())ACT.addline({dataset:{desc:e.target.value.trim()}})}
    else if(e.key=='Escape'){$('#pickList').hidden=true}}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=='s'&&VIEW=='quote'){e.preventDefault();saveQuote()}
});
window.addEventListener('resize',()=>{if(VIEW=='quote')schedulePreview()});

/* ---------- start ---------- */
function attach(){
  store.unsubs.forEach(u=>{try{u()}catch(e){}});store.unsubs=[];
  ['products','customers','quotes','staff','settings','allowed'].forEach(col=>store.watch(col,m=>{state[col]=m;
    if(col=='quotes')resolvePeople(Object.values(m).map(q=>q.updatedBy));
    if(col=='settings'&&VIEW=='settings'){const ae=document.activeElement;if(ae&&ae.dataset&&ae.dataset.s)return}
    onData()}));
}
function setupView(){
  $('#tabs').innerHTML='';
  $('#app').innerHTML=`<div class="panel" style="max-width:620px;margin:40px auto"><h1>Connect Firebase</h1><p>Quote Desk keeps your quotes in your own Firebase project. Open <b>index.html</b>, paste your Firebase settings into <code>FIREBASE_CONFIG</code> near the top of the script, then upload the file to GitHub again.</p><p class="muted small">${window.firebase?'':'The Firebase library did not load, so check your internet connection as well. '}README.md walks through every step.</p></div>`;
}
function loginView(msg){
  msg=msg||PENDING_MSG;PENDING_MSG='';ME=null;IS_ADMIN=false;renderWho();$('#tabs').innerHTML='';
  $('#app').innerHTML=`<div class="panel" style="max-width:400px;margin:48px auto"><img src="${LOGO}" alt="CityCube General Trading FZ LLC" style="width:120px;display:block;margin:0 auto 14px"><h1 style="text-align:center">Quote Desk</h1><p class="muted" style="text-align:center;margin-top:4px">Sign in with the email and password your admin gave you.</p>
  <form id="loginF" class="stack" style="gap:12px" novalidate><label class="f">Email<input id="le" type="email" autocomplete="username" required></label><label class="f">Password<input id="lp" type="password" autocomplete="current-password" required></label>
  <p class="flag bad" id="lmsg" style="margin:0" role="alert">${esc(msg||'')}</p><button class="btn pri" type="submit" style="justify-content:center">Sign in</button><button class="btn" type="button" id="forgot" style="justify-content:center">Forgot password</button></form></div>`;
  const say=t=>{$('#lmsg').textContent=t};
  $('#loginF').addEventListener('submit',async e=>{e.preventDefault();const em=$('#le').value.trim(),pw=$('#lp').value;if(!em||!pw)return say('Enter your email and password.');
    const btn=e.target.querySelector('[type=submit]');btn.disabled=true;btn.textContent='Signing in…';
    try{await AUTH.signInWithEmailAndPassword(em,pw)}catch(err){btn.disabled=false;btn.textContent='Sign in';
      const c=err&&err.code||'';say(c.includes('too-many')?'Too many attempts. Wait a few minutes, or reset your password.':c.includes('disabled')?'This login has been switched off. Ask your admin.':c.includes('network')?'No connection. Check your internet and try again.':'That email and password do not match. Check them, or reset your password.')}});
  $('#forgot').addEventListener('click',async()=>{const em=$('#le').value.trim();if(!em)return say('Type your email above first, then press Forgot password.');
    try{await AUTH.sendPasswordResetEmail(em);$('#lmsg').className='flag ok';say('If '+em+' has a login, a reset link is on its way. Check spam too.')}catch(err){say('Could not send the reset email. Check the address and try again.')}});
  setTimeout(()=>{const e=$('#le');e&&e.focus()},30);
}
function failView(title,detail){
  $('#tabs').innerHTML='';
  $('#app').innerHTML=`<div class="panel" style="max-width:640px;margin:40px auto"><h1>${esc(title)}</h1><p>${detail}</p><p class="small muted">Technical detail: <code id="errd"></code></p><button class="btn pri" onclick="location.reload()">Try again</button></div>`;
  return $('#errd');
}
window.addEventListener('error',e=>{if(!ME&&$('#app')&&/Loading Quote Desk|Checking your access/.test($('#app').textContent)){const d=failView('Quote Desk could not start','Something stopped the app from loading. Reload the page. If it keeps happening, send a screenshot of this message.');d.textContent=(e.message||'Unknown error')+(e.filename?' ('+e.filename.split('/').pop()+':'+e.lineno+')':'')}});
async function boot(){
  if(String(FIREBASE_CONFIG.apiKey).startsWith('PASTE')){setupView();return}
  const missing=[!window.jspdf&&'PDF tools (cdnjs.cloudflare.com)',!window.firebase&&'Firebase app',window.firebase&&!firebase.auth&&'Firebase sign-in',window.firebase&&!firebase.firestore&&'Firebase database'].filter(Boolean);
  if(missing.some(m=>m.startsWith('Firebase'))){failView('Firebase could not load','Your browser did not download: <b>'+missing.join(', ')+'</b>. This is usually an ad blocker, privacy extension or office firewall blocking <b>www.gstatic.com</b>. Allow that site, or try another browser or your phone, then reload.').textContent=missing.join(', ');return}
  try{firebase.initializeApp(FIREBASE_CONFIG);AUTH=firebase.auth();DB=firebase.firestore();}catch(e){failView('Firebase settings are not valid','Check the four values in FIREBASE_CONFIG near the top of index.html against Firebase console › Project settings › Your apps.').textContent=(e.code||'')+' '+(e.message||e);return}
  MODE='shared';
  const slow=setTimeout(()=>{if(!ME&&!$('#loginF'))failView('Still connecting to Firebase','The sign-in service has not answered after 15 seconds. Check your internet connection, then reload.').textContent='onAuthStateChanged timeout'},15000);
  AUTH.onAuthStateChanged(async u=>{clearTimeout(slow);
    store.unsubs.forEach(f=>{try{f()}catch(e){}});store.unsubs=[];
    for(const k of ['products','customers','quotes','staff','settings','allowed'])state[k]={};delete state._deniedShown;
    if(!u){loginView();return}
    ME=(u.email||'').toLowerCase();$('#app').innerHTML='<div class="empty"><h3>Checking your access…</h3></div>';
    let role=null;
    if(OWNER_EMAILS.map(e=>e.toLowerCase()).includes(ME))role='admin';
    else{try{const d=await DB.collection('allowed').doc(ME).get();if(d.exists)role=d.data().role=='admin'?'admin':'sales'}catch(e){}}
    if(!role){PENDING_MSG=ME+' is not on the CityCube staff list yet. Ask your admin to add it in Settings › Team access.';ME=null;await AUTH.signOut();return}
    IS_ADMIN=role=='admin';CAN_WRITE=true;CONNECTING=false;renderWho();attach();Q=null;render();
  });
}
boot();
</script>
