<style>:root{--ink:#18213A;--ink2:#5D677A;--mut:#7d8698;--line:#DCE1EA;--bg:#F3F5F9;--card:#fff;--side:#14305F;--side2:#1d3d74;--acc:#14305F;--acc2:#841564;--accl:#F6E8F1;--mag:#841564;--orange:#E5782A;--f-display:'Montserrat','Segoe UI',Arial,sans-serif;--f-body:'Source Sans 3','Segoe UI',system-ui,sans-serif;--red:#c0362c;--redl:#fdecea;--amb:#b7791f;--ambl:#fdf3e1;--grn:#1f7a4d;--grnl:#e5f4ec;--blu:#2b5fa8;--blul:#e8eff9;--r:10px;--sh:0 1px 2px rgba(16,40,52,.06),0 2px 8px rgba(16,40,52,.04)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:14.5px/1.45 var(--f-body),"Noto Sans Arabic";color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--f-display)}h1{font-size:22px;margin:0;font-weight:700;color:var(--acc);letter-spacing:-.01em}h2{font-size:17px;margin:18px 0 10px}h3{font-size:15px;margin:14px 0 8px;font-weight:600}h4{margin:14px 0 6px;font-size:13.5px}
#app{display:flex;min-height:100vh}
#side{width:236px;flex:none;background:linear-gradient(180deg,#14305F 0%,#112a54 70%,#2a1f4f 100%);color:#d6deee;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.07)}
.brand img{width:38px;height:auto;display:block;background:#fff;border-radius:9px;padding:3px}.bn{font:700 18px/1 var(--f-display);color:#fff;letter-spacing:-.2px}.bn span{color:#E388C0}.bs{font:600 9.5px/1.2 var(--f-display);letter-spacing:1.6px;text-transform:uppercase;color:#aebbd6;margin-top:4px}
#side nav{padding:8px;flex:1}#side nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:#c9d3e8;font-size:14px;font-weight:600;margin-bottom:1px}
#side nav a:hover{background:var(--side2);text-decoration:none;color:#fff}#side nav a.on{background:var(--mag);color:#fff;box-shadow:inset 3px 0 0 #E5782A}
#side nav svg{flex:none;opacity:.9}
.side-foot{padding:12px 16px;font-size:12px;color:#aebbd6;border-top:1px solid rgba(255,255,255,.07)}.ver{opacity:.6;margin-top:4px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}.dot.g{background:#34d399}.dot.a{background:#fbbf24}.dot.r{background:#f87171}
#mainwrap{flex:1;min-width:0;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 22px}
.co{min-width:0}.coname{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cosub{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.search{position:relative;margin-left:auto;width:300px}.search input{width:100%}
#gres{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.1);margin-top:4px;z-index:30;max-height:380px;overflow:auto}#gres:empty{display:none}
#gres a{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;color:var(--ink);cursor:pointer;border-bottom:1px solid var(--line)}#gres a:hover{background:var(--accl);text-decoration:none}#gres a span{color:var(--mut);font-size:12px}#gres .none{padding:10px;color:var(--mut)}
.quick{display:flex;gap:6px}#menuBtn{display:none}
#main{padding:20px 24px 60px;max-width:1500px;width:100%}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap}.psub{color:var(--ink2);font-size:13px;margin-top:4px}.pact{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);margin-bottom:16px}
.btn{font:inherit;font-size:13px;border:1px solid #cfd8dc;background:#fff;color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;line-height:1.2}

const APP_VERSION = '1.1.0';
const TARGET = (typeof BOOKS_TARGET !== 'undefined') ? BOOKS_TARGET : 'claude';

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const r2 = (n) => { n = Number(n) || 0; return Math.sign(n) * Math.round(Math.abs(n) * 100 + 1e-7) / 100; };
const num = (v) => { const n = parseFloat(String(v ?? '').replace(/,/g, '')); return isNaN(n) ? 0 : n; };
const fmt = (n, d = 2) => { n = Number(n) || 0; const s = Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }); return n < -0.004 ? '(' + s + ')' : s; };
const fmtS = (n) => (Math.abs(n) < 0.005 ? '–' : fmt(n));
const fmtK = (n) => { const a = Math.abs(n); return (n < 0 ? '-' : '') + (a >= 1e6 ? (a / 1e6).toFixed(2) + 'M' : a >= 1e3 ? (a / 1e3).toFixed(1) + 'K' : a.toFixed(0)); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const pad2 = (n) => String(n).padStart(2, '0');
const ymd = (d) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const parseD = (s) => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
const addMonths = (s, n) => { const d = parseD(s); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(day, last)); return ymd(d); };
const monthEnd = (s) => { const d = parseD(s); return ymd(new Date(d.getFullYear(), d.getMonth() + 1, 0)); };
const monthStart = (s) => s.slice(0, 8) + '01';
const daysBetween = (a, b) => Math.round((parseD(b) - parseD(a)) / 86400000);
const fmtD = (s) => { if (!s) return ''; const d = parseD(s); return pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1) + '/' + d.getFullYear(); };

function computeInventory() {

  });

/* ---------- Aging ---------- */

    r.b[b] = r2(r.b[b] + oA); r.total = r2(r.total + oA); r.docs.push({ d, o, oA, days });

    if (num(qty) > s.qty + 0.0001) t += ` · <span class="neg">only ${fmt(s.qty, 0)} in stock</span>`;
    if (priceAED > 0 && avg > 0) { const m = (1 - avg / priceAED) * 100; t += m < 0 ? ` · <span class="neg">below cost (${m.toFixed(1)}%)</span>` : ` · margin ${m.toFixed(1)}%`; }
  } else if (priceAED > 0 && avg > 0 && Math.abs(priceAED / avg - 1) > 0.15) t += ` · <span class="warnt">${priceAED > avg ? '+' : ''}${((priceAED / avg - 1) * 100).toFixed(0)}% vs average cost</span>`;
  return t;
}

    if (act === 'credit' || act === 'debit') { const n = JSON.parse(JSON.stringify(byId(coll, d.id))); ['fromQuoteDesk', 'source', 'qdSig', 'qdTotal', 'qdStatus', 'qdPaidAt'].forEach(k => delete n[k]); Object.assign(n, { id: uid(), type: act, no: '', status: 'draft', againstId: d.id, date: today(), createdAt: null, updatedAt: null, postedAt: null, reason: '', returnStock: true, paidFrom: '', converted: false }); go(VIEW.page, 'edit', null, { _draft: n }); }
    if (act === 'convert') { const src = byId(coll, d.id); const n = JSON.parse(JSON.stringify(src)); Object.assign(n, { id: uid(), type: side === 'S' ? 'invoice' : 'bill', no: '', status: 'draft', date: today(), dueDate: addDays(today(), num((contact(src.contactId) || {}).terms ?? 30)), fromId: src.id, createdAt: null, updatedAt: null, terms: S.settings.invTerms }); src.converted = n.id; await store.save(coll, src, 'convert'); go(VIEW.page, 'edit', null, { _draft: n }); }
    if (act === 'dup') { const n = JSON.parse(JSON.stringify(byId(coll, d.id))); Object.assign(n, { id: uid(), no: '', status: 'draft', date: today(), createdAt: null, updatedAt: null, postedAt: null, converted: false, voidReason: '' }); go(VIEW.page, 'edit', null, { _draft: n }); }
    if (act === 'pdf' || act === 'html') { const saved = byId(coll, d.id) || d; const html = docPrintHTML(saved, side); const name = (saved.no || 'draft').replace(/[^\w\-]/g, '_'); if (act === 'html') downloadFile(name + '.html', printableHTML(html, saved.no)); else { const host = document.createElement('div'); host.innerHTML = `<style>${PRINT_CSS}</style>` + html; await exportPDF(host, name, 'portrait', true); host.remove(); } }
    if (act === 'xml') downloadFile((d.no || 'invoice').replace(/[^\w\-]/g, '_') + '.xml', ublXML(byId(coll, d.id)));
  });
}

/* ---------- Amount in words (English) ---------- */
function words(n) {
  const a = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
  const b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
  const w = (x) => x < 20 ? a[x] : x < 100 ? b[Math.floor(x / 10)] + (x % 10 ? '-' + a[x % 10] : '') : x < 1000 ? a[Math.floor(x / 100)] + ' Hundred' + (x % 100 ? ' and ' + w(x % 100) : '') : x < 1e6 ? w(Math.floor(x / 1000)) + ' Thousand' + (x % 1000 ? (x % 1000 < 100 ? ' and ' : ' ') + w(x % 1000) : '') : x < 1e9 ? w(Math.floor(x / 1e6)) + ' Million' + (x % 1e6 ? ' ' + w(x % 1e6) : '') : w(Math.floor(x / 1e9)) + ' Billion' + (x % 1e9 ? ' ' + w(x % 1e9) : '');
  const i = Math.floor(Math.abs(n)), f = Math.round((Math.abs(n) - i) * 100);
  return (i ? w(i) : 'Zero');
}
function amountWords(n, cur) { const i = Math.floor(Math.abs(n)), f = Math.round((Math.abs(n) - i) * 100); const names = { AED: ['UAE Dirhams', 'Fils'], USD: ['US Dollars', 'Cents'], EUR: ['Euros', 'Cents'], GBP: ['Pounds Sterling', 'Pence'], SAR: ['Saudi Riyals', 'Halalas'] }[cur] || [cur, 'cents']; return names[0] + ' ' + words(i) + (f ? ' and ' + words(f) + ' ' + names[1] : '') + ' Only'; }

/* ---------- UBL 2.1 / Peppol PINT AE draft XML (for submission through an Accredited Service Provider) ---------- */
function ublXML(d) {
  const s = S.settings; const c = calcDoc(d, 'S'); const ct = contact(d.contactId) || {}; const cur = d.currency || 'AED'; const isCN = d.type === 'credit';
  const X = (v) => esc(v); const root = isCN ? 'CreditNote' : 'Invoice'; const ln = isCN ? 'CreditNoteLine' : 'InvoiceLine'; const q = isCN ? 'CreditedQuantity' : 'InvoicedQuantity';
  const cat = (code) => VAT_SALES[code].ubl; const pct = (code) => VAT_SALES[code].rate * 100;
  const sub = {}; c.lines.forEach(l => { const k = cat(l.code); sub[k] = sub[k] || { net: 0, vat: 0, pct: pct(l.code) }; sub[k].net = r2(sub[k].net + l.net); sub[k].vat = r2(sub[k].vat + l.vat); });
  const orig = d.againstId ? byId('sales', d.againstId) : null;
  const party = (p, isSup) => `<cac:Party>
      <cbc:EndpointID schemeID="0235">${X(isSup ? (s.trn || '') : (p.trn || ''))}</cbc:EndpointID>
      <cac:PartyName><cbc:Name>${X(isSup ? s.name : p.name)}</cbc:Name></cac:PartyName>
      <cac:PostalAddress><cbc:StreetName>${X(isSup ? s.address : p.address)}</cbc:StreetName><cbc:CityName>${X(isSup ? (EMIRATES.find(e => e[0] === s.emirate) || [])[1] : p.city)}</cbc:CityName>${isSup ? `<cbc:CountrySubentity>${X(s.emirate)}</cbc:CountrySubentity>` : ''}<cac:Country><cbc:IdentificationCode>${X(isSup ? 'AE' : (p.country || 'AE'))}</cbc:IdentificationCode></cac:Country></cac:PostalAddress>
      ${(isSup ? s.trn : p.trn) ? `<cac:PartyTaxScheme><cbc:CompanyID>${X(isSup ? s.trn : p.trn)}</cbc:CompanyID><cac:TaxScheme><cbc:ID>VAT</cbc:ID></cac:TaxScheme></cac:PartyTaxScheme>` : ''}
      <cac:PartyLegalEntity><cbc:RegistrationName>${X(isSup ? s.name : p.name)}</cbc:RegistrationName>${isSup && s.licenceNo ? `<cbc:CompanyID>${X(s.licenceNo)}</cbc:CompanyID>` : ''}</cac:PartyLegalEntity>
    </cac:Party>`;
  return `<?xml version="1.0" encoding="UTF-8"?>
<!-- Draft UAE e-invoice (UBL 2.1, Peppol PINT AE profile). Validate and transmit through your Accredited Service Provider (Ministerial Decisions 243 & 244 of 2025). -->
<${root} xmlns="urn:oasis:names:specification:ubl:schema:xsd:${root}-2" xmlns:cac="urn:oasis:names:specification:ubl:schema:xsd:CommonAggregateComponents-2" xmlns:cbc="urn:oasis:names:specification:ubl:schema:xsd:CommonBasicComponents-2">
  <cbc:CustomizationID>urn:peppol:pint:billing-1@ae-1</cbc:CustomizationID>
  <cbc:ProfileID>urn:peppol:bis:billing</cbc:ProfileID>
  <cbc:ID>${X(d.no)}</cbc:ID>
  <cbc:IssueDate>${d.date}</cbc:IssueDate>
  ${!isCN && d.dueDate ? `<cbc:DueDate>${d.dueDate}</cbc:DueDate>` : ''}
  <cbc:${isCN ? 'CreditNoteTypeCode' : 'InvoiceTypeCode'}>${isCN ? '381' : '380'}</cbc:${isCN ? 'CreditNoteTypeCode' : 'InvoiceTypeCode'}>
  ${d.notes ? `<cbc:Note>${X(d.notes)}</cbc:Note>` : ''}${d.reason ? `<cbc:Note>${X(d.reason)}</cbc:Note>` : ''}
  <cbc:TaxPointDate>${d.supplyDate || d.date}</cbc:TaxPointDate>
  <cbc:DocumentCurrencyCode>${cur}</cbc:DocumentCurrencyCode>
  ${cur !== 'AED' ? '<cbc:TaxCurrencyCode>AED</cbc:TaxCurrencyCode>' : ''}
  ${d.reference ? `<cac:OrderReference><cbc:ID>${X(d.reference)}</cbc:ID></cac:OrderReference>` : ''}
  ${orig ? `<cac:BillingReference><cac:InvoiceDocumentReference><cbc:ID>${X(orig.no)}</cbc:ID><cbc:IssueDate>${orig.date}</cbc:IssueDate></cac:InvoiceDocumentReference></cac:BillingReference>` : ''}
  <cac:AccountingSupplierParty>${party(null, true)}</cac:AccountingSupplierParty>
  <cac:AccountingCustomerParty>${party(ct, false)}</cac:AccountingCustomerParty>
  <cac:TaxTotal><cbc:TaxAmount currencyID="${cur}">${c.vat.toFixed(2)}</cbc:TaxAmount>
${Object.entries(sub).map(([k, v]) => `    <cac:TaxSubtotal><cbc:TaxableAmount currencyID="${cur}">${v.net.toFixed(2)}</cbc:TaxableAmount><cbc:TaxAmount currencyID="${cur}">${v.vat.toFixed(2)}</cbc:TaxAmount><cac:TaxCategory><cbc:ID>${k}</cbc:ID><cbc:Percent>${v.pct}</cbc:Percent><cac:TaxScheme><cbc:ID>VAT</cbc:ID></cac:TaxScheme></cac:TaxCategory></cac:TaxSubtotal>`).join('\n')}
  </cac:TaxTotal>
  ${cur !== 'AED' ? `<cac:TaxTotal><cbc:TaxAmount currencyID="AED">${c.vatA.toFixed(2)}</cbc:TaxAmount></cac:TaxTotal>` : ''}
  <cac:LegalMonetaryTotal><cbc:LineExtensionAmount currencyID="${cur}">${c.net.toFixed(2)}</cbc:LineExtensionAmount><cbc:TaxExclusiveAmount currencyID="${cur}">${c.net.toFixed(2)}</cbc:TaxExclusiveAmount><cbc:TaxInclusiveAmount currencyID="${cur}">${c.total.toFixed(2)}</cbc:TaxInclusiveAmount><cbc:PayableAmount currencyID="${cur}">${c.total.toFixed(2)}</cbc:PayableAmount></cac:LegalMonetaryTotal>
${d.lines.map((l, i) => { const cl = c.lines[i]; const it = item(l.itemId); return `  <cac:${ln}><cbc:ID>${i + 1}</cbc:ID><cbc:${q} unitCode="${it && it.unit === 'kg' ? 'KGM' : 'C62'}">${num(l.qty)}</cbc:${q}><cbc:LineExtensionAmount currencyID="${cur}">${cl.net.toFixed(2)}</cbc:LineExtensionAmount>
    <cac:Item><cbc:Name>${X(l.desc)}</cbc:Name>${it && it.sku ? `<cac:SellersItemIdentification><cbc:ID>${X(it.sku)}</cbc:ID></cac:SellersItemIdentification>` : ''}${it && it.hs ? `<cac:CommodityClassification><cbc:ItemClassificationCode listID="HS">${X(it.hs)}</cbc:ItemClassificationCode></cac:CommodityClassification>` : ''}<cac:ClassifiedTaxCategory><cbc:ID>${cat(cl.code)}</cbc:ID><cbc:Percent>${pct(cl.code)}</cbc:Percent><cac:TaxScheme><cbc:ID>VAT</cbc:ID></cac:TaxScheme></cac:ClassifiedTaxCategory></cac:Item>
    <cac:Price><cbc:PriceAmount currencyID="${cur}">${r2(num(l.price) * (1 - num(l.disc) / 100)).toFixed(2)}</cbc:PriceAmount></cac:Price></cac:${ln}>`; }).join('\n')}
</${root}>`;
}

function complianceCalendar() {
  const t = today(); const out = []; const s = S.settings;
  if (!s.vatRegistered) { const th = vatThreshold(t); if (th.mustRegister) out.push({ d: t, t: 'VAT registration required', n: 'Taxable supplies & imports in the last 12 months AED ' + fmt(th.taxable, 0) + ' exceed AED 375,000 – apply on EmaraTax within 30 days' }); else if (th.pct >= 70) out.push({ d: t, t: 'Approaching VAT registration threshold', n: 'AED ' + fmt(th.taxable, 0) + ' of AED 375,000 (' + th.pct.toFixed(0) + '%) in the last 12 months' }); }
  let p = vatPeriodOf(addDays(t, -60)); for (let i = 0; i < 4 && s.vatRegistered; i++) { const due = vatDue(p.to); const filed = S.data.vatreturns.find(v => v.from === p.from && v.status === 'filed'); if (!filed && due >= addDays(t, -60)) out.push({ d: due, t: 'VAT return & payment', n: 'Period ' + fmtD(p.from) + ' – ' + fmtD(p.to) + (due < t ? ' · OVERDUE' : '') }); p = vatPeriodOf(addDays(p.to, 1)); }
  const fe = addDays(fyStartOf(t), -1); const ctDue = monthEnd(addMonths(addDays(fe, 1), 8)); if (ctDue >= t) out.push({ d: ctDue, t: 'Corporate Tax return & payment', n: fyLabel(fyStartOf(fe)) + ' (9 months after year end)' });
  out.push({ d: fyEndOf(t), t: 'Financial year end', n: 'Stock count, close, CT provision' });
  if (s.licenceExpiry) out.push({ d: s.licenceExpiry, t: 'Trade licence renewal', n: s.freezone || 'Licensing authority' });
  if (t < '2027-03-31') out.push({ d: '2027-03-31', t: 'E-invoicing: appoint ASP (revenue < AED 50m)', n: 'Ministerial Decision 244/2025 · go-live 1 Jul 2027' });
  const mEnd = monthEnd(t); out.push({ d: mEnd, t: 'Month-end close & payroll (WPS)', n: 'Salaries due via WPS; depreciation, accruals' });
  S.data.employees.filter(e => !e.leaveDate && e.visaExpiry && e.visaExpiry <= addDays(t, 60)).forEach(e => out.push({ d: e.visaExpiry, t: 'Visa expiry – ' + e.name, n: 'Renew residence & Emirates ID' }));
  return out.filter(x => x.d >= addDays(t, -60)).sort((a, b) => a.d.localeCompare(b.d)).slice(0, 8);
}

/* ===================== Connection: CityCube Quote Desk → Books ===================== */
function parseQuoteDeskPayload(text) {
  let o; try { o = JSON.parse(String(text).trim()); } catch (e) { throw new Error('That is not data copied from CityCube Quote Desk.'); }
  if (!o || (o.app !== 'citycube-quote-desk')) throw new Error('That is not data copied from CityCube Quote Desk.');
  const quotes = Array.isArray(o.quotes) ? o.quotes : Object.values(o.quotes || {});
  const products = Array.isArray(o.products) ? o.products : Object.values(o.products || {});
  const customers = Array.isArray(o.customers) ? o.customers : Object.values(o.customers || {});
  return { quotes: quotes.filter(q => q && q.no && q.status !== 'Revised'), products, customers, handoff: o.kind === 'books-handoff' };
}
function qdCalc(q) { let sub = 0; (q.lines || []).forEach(l => sub += r2(num(l.qty) * num(l.price) * (1 - num(l.disc) / 100))); sub = r2(sub); const disc = r2(q.discType === 'amt' ? Math.min(sub, num(q.disc)) : sub * num(q.disc) / 100); const net = r2(sub - disc); const vat = r2(net * num(q.vat) / 100); return { sub, disc, net, vat, total: r2(net + vat) }; }
const qdNo = (q) => q.no + (q.rev ? ' Rev ' + q.rev : '');
async function qdMatchContact(cu, created) {
  const name = (cu.name || '').trim(); if (!name) return null; const trn = (cu.trn || '').replace(/\D/g, '');
  let c = S.data.contacts.find(x => trn && x.trn === trn) || S.data.contacts.find(x => x.name.trim().toLowerCase() === name.toLowerCase());
  if (c) { if (!c.isCustomer) { c = { ...c, isCustomer: true }; await store.save('contacts', c, 'link'); } return c; }
  c = { id: uid(), name, isCustomer: true, isSupplier: false, trn: /^\d{15}$/.test(trn) ? trn : '', vatRegistered: /^\d{15}$/.test(trn), country: 'AE', emirate: S.settings.emirate || 'DXB', location: 'mainland', address: cu.addr || '', phone: cu.phone || '', email: cu.email || '', notes: cu.attn ? 'Attn: ' + cu.attn : '', currency: 'AED', terms: 30, active: true, source: 'Quote Desk' };
  await store.save('contacts', c, 'import'); created.contacts++; return c;
}
async function qdMatchItem(l, created) {
  const code = (l.code || '').trim(); if (!code) return null;
  let it = S.data.items.find(x => (x.sku || '').toLowerCase() === code.toLowerCase()); if (it) return it;
  it = { id: uid(), sku: code, name: l.desc || code, description: l.details || '', type: 'goods', unit: (l.uom || 'pcs').toLowerCase() === 'nos' ? 'pcs' : (l.uom || 'pcs'), price: num(l.price), cost: num(l.cost), vatS: 'SR', vatP: 'SR', salesAcc: '4100', active: true, source: 'Quote Desk' };
  await store.save('items', it, 'import'); created.items++; return it;
}
async function importQuoteDesk(payload, opts) {
  const created = { contacts: 0, items: 0, docs: 0, skipped: [] }; const made = [];
  for (const p of payload.products) { if (p && p.code && !S.data.items.find(x => (x.sku || '').toLowerCase() === p.code.toLowerCase())) { await qdMatchItem({ code: p.code, desc: p.desc, details: p.details, uom: p.uom, price: p.price, cost: p.cost }, created); } }
  for (const c of payload.customers) if (c && c.name) await qdMatchContact(c, created);
  for (const q of payload.quotes.filter(x => opts.pick.includes(x.id || qdNo(x)))) {
    const key = 'QD:' + qdNo(q);
    if (S.data.sales.find(d => d.fromQuoteDesk === key && d.status !== 'void' && d.type === opts.as)) { created.skipped.push(qdNo(q)); continue; }
    const ct = await qdMatchContact(q.cust || {}, created); if (!ct) { created.skipped.push(qdNo(q) + ' (no customer)'); continue; }
    const c = qdCalc(q); const extra = c.sub ? c.disc / c.sub * 100 : 0; const vat = num(q.vat) >= 5 ? 'SR' : 'ZR';
    const lines = [];
    for (const l of (q.lines || [])) { const it = await qdMatchItem(l, created); const d1 = num(l.disc); const disc = Math.round((1 - (1 - d1 / 100) * (1 - extra / 100)) * 100 * 10000) / 10000; lines.push({ estCost: l.cost != null && l.cost !== '' ? num(l.cost) : null, itemId: it ? it.id : '', desc: (l.desc || '') + (l.details ? ' – ' + l.details : ''), qty: num(l.qty), price: num(l.price), disc: disc || 0, vat, acc: it ? '' : '4100' }); }
    const t = q.terms || {};
    const doc = { id: uid(), type: opts.as, no: '', date: opts.as === 'invoice' ? today() : (q.date || today()), status: opts.as === 'quote' ? 'posted' : 'draft', contactId: ct.id, currency: 'AED', rate: 1, emirate: ct.emirate || S.settings.emirate || 'DXB', reference: [q.ref, 'Quote ' + qdNo(q)].filter(Boolean).join(' · '), supplyDate: '', dueDate: opts.as === 'quote' ? addDays(q.date || today(), num(q.validDays) || 15) : addDays(today(), num(ct.terms ?? 30)), lines, notes: [q.subject, q.notes].filter(Boolean).join('\n'), terms: [t.payment ? 'Payment: ' + t.payment : '', t.delivery ? 'Delivery: ' + t.delivery : '', t.warranty ? 'Warranty: ' + t.warranty : ''].filter(Boolean).join('\n') || S.settings.invTerms, fromQuoteDesk: key };
    if (opts.as === 'quote') doc.no = nextNumber('qt');
    const check = calcDoc(doc, 'S'); doc._total = check.total;
    await store.save('sales', doc, 'import'); created.docs++; made.push({ doc, qdTotal: c.total, total: check.total });
  }
  return { created, made };
}

/* Attachment panel used on bills, invoices, credit notes, receipts and payments.

/* ===================== Job costing: profitability of each sales invoice =====================
   A sales invoice is a "job". Purchase and expense lines (and journal lines) can be linked to one or more invoices.
   Linking is management information only – it never changes the ledger, so it can be done or changed at any time,
   even after posting or in a locked period. Stock items sold already carry their cost (weighted average) to the job. */
let _JC = null, _JCV = -1;
function jobCostIndex() {
  if (_JCV === LEDGER_VER && _JC) return _JC;
  const idx = {}; const push = (jid, rec) => { (idx[jid] = idx[jid] || []).push(rec); };
  S.data.purchases.filter(d => isLive(d) && ['bill', 'debit'].includes(d.type)).forEach(d => {
    const c = calcDoc(d, 'P'); const sg = d.type === 'debit' ? -1 : 1;
    d.lines.forEach((l, i) => {
      if (tracksStock(l.itemId)) return; // stock reaches the job through cost of goods sold when sold
      const cl = c.lines[i]; const amt = r2(sg * (cl.netA + (cl.code === 'SRN' ? cl.vatA : 0))); if (!amt) return;
      const base = { src: 'purchases', docId: d.id, no: d.no, date: d.date, party: (docParty(d) || {}).name || '', desc: l.desc, line: i, kind: billKind(d) === 'purchase' ? 'Direct purchase' : 'Expense' };
      if (l.jobs && l.jobs.length) { const tot = l.jobs.reduce((s, j) => s + num(j.amount), 0) || 1; l.jobs.forEach(j => push(j.docId, { ...base, amt: r2(amt * num(j.amount) / tot), split: l.jobs.length > 1 })); }
      else if (d.jobId) push(d.jobId, { ...base, amt });
    });
  });
  S.data.journals.filter(isLive).forEach(j => j.lines.forEach((l, i) => {
    const jid = l.jobId || j.jobId; if (!jid) return; const a = acc(l.acc); if (!a || a.type !== 'X') return;
    const amt = r2(num(l.dr) - num(l.cr)); if (amt) push(jid, { src: 'journals', docId: j.id, no: j.no, date: j.date, party: '', desc: l.desc || j.memo, line: i, kind: 'Journal', amt });
  }));
  _JC = idx; _JCV = LEDGER_VER; return idx;
}
function invoiceProfit(inv) {
  const INV = L().INV; const c = calcDoc(inv, 'S');
  let rev = c.netA, cogs = 0, est = 0, hasEst = false;
  inv.lines.forEach((l, i) => { if (tracksStock(l.itemId)) cogs += INV.cost[inv.id + ':' + i] || 0; if (l.estCost != null && l.estCost !== '') { hasEst = true; est += num(l.qty) * num(l.estCost) * (num(inv.rate) || 1); } });
  const cns = S.data.sales.filter(x => isLive(x) && x.type === 'credit' && x.againstId === inv.id);
  cns.forEach(cn => { rev -= calcDoc(cn, 'S').netA; if (cn.returnStock !== false) cn.lines.forEach((l, i) => { if (tracksStock(l.itemId)) cogs -= INV.cost[cn.id + ':' + i] || 0; }); });
  const list = (jobCostIndex()[inv.id] || []).slice().sort((a, b) => a.date.localeCompare(b.date));
  const costs = r2(list.reduce((s, x) => s + x.amt, 0)); rev = r2(rev); cogs = r2(cogs);
  const gp = r2(rev - cogs - costs);

}
const jobLabel = (d) => { const c = docParty(d); return d.no + ' · ' + (c ? c.name : '') + ' · ' + fmtD(d.date); };
function jobInvoices() { return S.data.sales.filter(d => d.type === 'invoice' && d.status === 'posted').sort((a, b) => (b.date + b.no).localeCompare(a.date + a.no)); }

function jobOptions(sel, blank = '— not linked —') { return opt('', blank, sel) + jobInvoices().filter(d => !d.jobClosed || d.id === sel).map(d => opt(d.id, (d.jobClosed ? '🔒 ' : '') + jobLabel(d) + ' · ' + (d.currency || 'AED') + ' ' + fmt(calcDoc(d, 'S').total), sel)).join(''); }

/* Report: profitability of every invoice */
REPORT_FN.jobprofit = (m) => {
  const { from, to } = periodFromParams(); const by = VIEW.params.by || 'invoice';
  const invs = S.data.sales.filter(d => d.type === 'invoice' && d.status === 'posted' && d.date >= from && d.date <= to);

/* Forecast of bank + cash day by day for the next 30 days (conservative: overdue receivables are not assumed collected) */

  await bootContinue();
}
async function bootContinue() {
  $('#main').innerHTML = '<div class="loading"><div class="spin"></div><p>Opening the books…</p></div>';

  if (S.settings.name === 'CityCube General Trading LLC FZ') { S.settings.name = DEFAULT_SETTINGS.name; S.settings.nameAr = DEFAULT_SETTINGS.nameAr; try { await store.saveSettings('Legal name corrected to ' + DEFAULT_SETTINGS.name); } catch (e) { } }

}
